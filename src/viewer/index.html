<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ea;
    --panel: #fbfaf6;
    --panel-2: #efebe2;
    --ink: #15171c;
    --ink-2: #4a4e57;
    --ink-3: #7b7f88;
    --line: #dcd6c9;
    --accent: #1f5f4a;

    --ok: #157a46;      --ok-bg: #e2f2e8;
    --bad: #c0322a;     --bad-bg: #fbe5e2;
    --ask: #2357c9;     --ask-bg: #e3ebfb;
    --tid: #7438d6;     --tid-bg: #efe6fc;
    --off: #6c7079;     --off-bg: #e9e7e2;
    --warn: #b86a00;    --warn-bg: #fdf0d9;

    --sans: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: "Instrument Serif", ui-serif, Georgia, "Times New Roman", serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --shadow: 0 1px 0 rgba(20, 20, 20, .04), 0 8px 24px -16px rgba(20, 20, 20, .25);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1013;
      --panel: #16191e;
      --panel-2: #1d2128;
      --ink: #eef0f3;
      --ink-2: #b4b9c2;
      --ink-3: #868c96;
      --line: #2a2f37;
      --accent: #6fd3a8;
      --ok: #4ad68c;      --ok-bg: #12301f;
      --bad: #ff6f63;     --bad-bg: #3a1714;
      --ask: #7aa7ff;     --ask-bg: #172747;
      --tid: #c49bff;     --tid-bg: #2c1c4a;
      --off: #9aa0aa;     --off-bg: #23272e;
      --warn: #ffb547;    --warn-bg: #3a2a0c;
      --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 30px -18px rgba(0, 0, 0, .8);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1013;
    --panel: #16191e;
    --panel-2: #1d2128;
    --ink: #eef0f3;
    --ink-2: #b4b9c2;
    --ink-3: #868c96;
    --line: #2a2f37;
    --accent: #6fd3a8;
    --ok: #4ad68c;      --ok-bg: #12301f;
    --bad: #ff6f63;     --bad-bg: #3a1714;
    --ask: #7aa7ff;     --ask-bg: #172747;
    --tid: #c49bff;     --tid-bg: #2c1c4a;
    --off: #9aa0aa;     --off-bg: #23272e;
    --warn: #ffb547;    --warn-bg: #3a2a0c;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 30px -18px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 20px;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 18px 40px 16px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 18px; min-width: 0; }
  .wordmark {
    font-family: var(--serif);
    font-size: 56px;
    line-height: 1;
    letter-spacing: -0.01em;
    margin: 0;
    font-weight: 400;
  }
  .wordmark i { color: var(--accent); font-style: italic; }
  .tagline { color: var(--ink-3); font-size: 19px; white-space: nowrap; }
  .spacer { flex: 1; }
  .live {
    display: inline-flex; align-items: center; gap: 10px;
    color: var(--ink-3); font-size: 17px; font-weight: 500;
  }
  .live .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--off); }
  .live.on .dot { background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: pulse 2.4s ease-out infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 55%, transparent); }
    70% { box-shadow: 0 0 0 10px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  .chain {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 10px 18px 10px 14px;
    border-radius: 999px;
    font-weight: 600; font-size: 19px;
    background: var(--ok-bg); color: var(--ok);
    border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent);
    white-space: nowrap;
  }
  .chain svg { width: 22px; height: 22px; flex: none; }
  .chain.broken { background: var(--bad-bg); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }

  main {
    display: grid;
    grid-template-columns: minmax(400px, 36%) 1fr;
    gap: 36px;
    padding: 22px 40px 40px;
    align-items: start;
  }
  h2 {
    margin: 0 0 16px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-3);
    display: flex; align-items: baseline; gap: 12px;
  }
  h2 .count { font-family: var(--mono); letter-spacing: 0; text-transform: none; font-weight: 500; }

  /* Grants */
  .grants { display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 20px 14px;
    box-shadow: var(--shadow);
    transition: opacity .3s ease, filter .3s ease;
  }
  .card-top { display: flex; align-items: flex-start; gap: 16px; }
  .card-title { flex: 1; min-width: 0; }
  .card h3 { margin: 0; font-size: 28px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .app {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 6px;
    color: var(--ink-2); font-size: 18px; font-weight: 500;
  }
  .app .glyph {
    width: 22px; height: 22px; border-radius: 6px;
    display: inline-grid; place-items: center;
    font-size: 13px; font-weight: 700; color: #fff;
  }
  .glyph.calendar { background: #e0483e; }
  .glyph.reminders { background: #f29a1f; }
  .glyph.mail { background: #2f7ef0; }
  .glyph.messages { background: #2fb34f; }
  .clock { text-align: right; flex: none; }
  .clock .t {
    font-family: var(--mono); font-size: 34px; font-weight: 600; line-height: 1;
    font-variant-numeric: tabular-nums; color: var(--ink);
  }
  .clock .sub { font-size: 15px; color: var(--ink-3); margin-top: 6px; }
  .clock.session .t { font-family: var(--sans); font-size: 20px; font-weight: 600; color: var(--ink-2); padding-top: 6px; }
  .clock.amber .t { color: var(--warn); }
  .state {
    display: inline-block; padding: 6px 12px; border-radius: 8px;
    font-size: 18px; font-weight: 700; letter-spacing: .02em;
  }
  .state.expired { background: var(--off-bg); color: var(--off); }
  .state.revoked { background: var(--bad-bg); color: var(--bad); }

  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  .chips .grow { flex: 1; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px; border-radius: 999px;
    font-size: 17px; font-weight: 600;
    background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--line);
  }
  .chip.t1 { background: var(--ask-bg); color: var(--ask); border-color: transparent; }
  .chip.t2 { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
  .chip.t3 { background: var(--tid-bg); color: var(--tid); border-color: transparent; }
  .chip.t0 { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
  .chip small { font-weight: 500; opacity: .85; font-size: 14px; }

  dl.scope { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; font-size: 18px; }
  dl.scope dt { color: var(--ink-3); font-weight: 500; }
  dl.scope dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; }
  dl.scope dd .f { font-family: var(--mono); font-size: 16px; }

  .card-foot { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .card-foot .src { color: var(--ink-3); font-size: 15px; flex: 1; }
  button.revoke {
    font: inherit; font-size: 17px; font-weight: 600;
    padding: 7px 18px; border-radius: 10px; cursor: pointer;
    background: transparent; color: var(--bad);
    border: 1.5px solid color-mix(in srgb, var(--bad) 55%, transparent);
    transition: background .15s ease, color .15s ease;
  }
  button.revoke:hover { background: var(--bad); color: #fff; }
  button.revoke:focus-visible { outline: 3px solid color-mix(in srgb, var(--bad) 40%, transparent); outline-offset: 2px; }
  button.revoke:disabled { opacity: .5; cursor: default; }
  .card.inactive { opacity: .55; filter: saturate(.4); }
  .card.inactive .chips, .card.inactive dl { opacity: .8; }

  /* Ledger */
  .ledger {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: -4px 0 14px; font-size: 15px; color: var(--ink-3); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .row {
    display: grid;
    grid-template-columns: 100px 180px minmax(0, 1fr);
    gap: 4px 20px;
    padding: 14px 22px 14px 18px;
    border-bottom: 1px solid var(--line);
    border-left: 6px solid var(--c, var(--off));
    align-items: start;
  }
  .row:last-child { border-bottom: 0; }
  .row .time { font-family: var(--mono); font-size: 18px; color: var(--ink-2); padding-top: 4px; font-variant-numeric: tabular-nums; }
  .row .seq { display: block; font-size: 13px; color: var(--ink-3); margin-top: 4px; }
  .pill {
    display: inline-block; justify-self: start;
    padding: 5px 12px; border-radius: 8px;
    font-size: 16px; font-weight: 700; letter-spacing: .01em;
    background: var(--cb, var(--off-bg)); color: var(--c, var(--off));
    white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  }
  .row .body { min-width: 0; }
  .row .tool { font-family: var(--mono); font-size: 15px; color: var(--ink-3); }
  .row .summary { font-size: 21px; font-weight: 500; margin-top: 2px; overflow-wrap: anywhere; }
  .row .returned { font-size: 17px; color: var(--ink-2); margin-top: 4px; overflow-wrap: anywhere; }
  .row .returned::before { content: "Returned: "; color: var(--ink-3); }
  .d-ok  { --c: var(--ok);  --cb: var(--ok-bg); }
  .d-bad { --c: var(--bad); --cb: var(--bad-bg); }
  .d-ask { --c: var(--ask); --cb: var(--ask-bg); }
  .d-tid { --c: var(--tid); --cb: var(--tid-bg); }
  .d-off { --c: var(--off); --cb: var(--off-bg); }
  .d-warn { --c: var(--warn); --cb: var(--warn-bg); }
  .row .why {
    font-family: var(--serif); font-style: italic; font-size: 22px; line-height: 1.25;
    color: var(--ink-2); margin-top: 4px; overflow-wrap: anywhere;
  }
  .row .why::before { content: "\201C"; } .row .why::after { content: "\201D"; }
  .row .withheld { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 8px; font-size: 16px; color: var(--ink-3); }
  .row .withheld .lbl { font-weight: 600; color: var(--ink-2); }
  .redact {
    display: inline-block; position: relative;
    font-family: var(--mono); font-size: 15px; line-height: 1.35;
    padding: 1px 8px; border-radius: 3px;
    background: #0b0b0c; color: transparent;
    cursor: help; outline: none;
    transition: background .18s ease, color .18s ease;
  }
  :root[data-theme="dark"] .redact { box-shadow: inset 0 0 0 1px #3a3f48; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .redact { box-shadow: inset 0 0 0 1px #3a3f48; } }
  .redact:hover, .redact:focus-visible { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink-3); }
  .row .withheld .hid { font-weight: 600; color: var(--ink-2); }

  /* Waiting for you */
  .row.pending { background: var(--warn-bg); border-left-width: 8px; }
  .row.pending .pill { background: var(--warn); color: #fff; }
  :root[data-theme="dark"] .row.pending .pill { color: #1a1205; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .row.pending .pill { color: #1a1205; } }
  .row.pending .time .left { font-size: 22px; font-weight: 600; color: var(--warn); }
  .row.pending .where { font-size: 15px; color: var(--ink-3); margin-top: 6px; }
  .row.pending { animation: wait 2s ease-in-out infinite; }
  @keyframes wait { 50% { background: color-mix(in srgb, var(--warn-bg) 60%, var(--panel)); } }

  /* Blocked toast: a quiet card in the corner, like a system notification */
  .banner {
    position: fixed; top: 20px; right: 20px; z-index: 50;
    width: min(400px, calc(100vw - 32px));
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-left: 4px solid #c0322a; border-radius: 14px;
    padding: 14px 16px 16px; overflow: hidden;
    display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: start;
    box-shadow: 0 12px 32px -12px rgba(0, 0, 0, .35);
    transform: translateX(calc(100% + 40px)); transition: transform .35s cubic-bezier(.2, .8, .2, 1);
    cursor: pointer;
  }
  .banner.show { transform: none; }
  .banner .shield { width: 22px; height: 22px; color: #c0322a; grid-row: span 3; margin-top: 2px; }
  .banner .big { font-size: 15px; font-weight: 700; color: #c0322a; letter-spacing: 0; }
  .banner .what { min-width: 0; grid-column: 2; }
  .banner .b-summary { font-size: 15px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .banner .b-why { font-family: var(--serif); font-style: italic; font-size: 14px; line-height: 1.3; color: var(--ink-3); margin-top: 2px; overflow-wrap: anywhere; }
  .banner .b-why::before { content: "\201C"; }
  .banner .b-why::after { content: "\201D"; }
  .banner .b-where { grid-column: 2; font-size: 12px; color: var(--ink-3); }
  .banner .b-head { display: flex; align-items: baseline; gap: 8px; grid-column: 2; }
  .banner .b-tool { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
  .banner .b-bar { position: absolute; left: 0; bottom: 0; height: 3px; background: #c0322a; opacity: .5; width: 100%; transform-origin: left; }
  .banner.show .b-bar { animation: drain 6s linear forwards; }
  @keyframes drain { to { transform: scaleX(0); } }
  .row.enter { animation: enter .9s cubic-bezier(.2, .8, .2, 1); }
  @keyframes enter {
    0% { opacity: 0; transform: translateY(-10px); background: var(--cb); }
    25% { opacity: 1; transform: none; background: var(--cb); }
    100% { background: transparent; }
  }
  .empty { padding: 48px 24px; text-align: center; color: var(--ink-3); font-size: 20px; }
  .empty strong { display: block; color: var(--ink-2); font-size: 24px; margin-bottom: 6px; font-weight: 600; }
  .error { color: var(--bad); font-size: 17px; margin-top: 8px; }

  @media (prefers-reduced-motion: reduce) {
    .row.enter, .live.on .dot, .row.pending, .banner.show .b-bar { animation: none; }
    .banner { transition: none; }
  }
  @media (max-width: 1100px) {
    main { grid-template-columns: 1fr; }
    .grants { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  }
  @media (max-width: 720px) {
    body { font-size: 17px; }
    header { flex-wrap: wrap; padding: 16px; gap: 12px; }
    .wordmark { font-size: 44px; }
    .tagline { display: none; }
    .spacer { display: none; }
    .chain { font-size: 16px; padding: 8px 14px 8px 12px; }
    main { padding: 18px 16px 32px; gap: 28px; }
    .grants { grid-template-columns: 1fr; }
    .card h3 { font-size: 24px; }
    .clock .t { font-size: 28px; }
    .row { grid-template-columns: auto 1fr; padding: 14px 16px 14px 14px; gap: 8px 12px; }
    .row .time { padding-top: 3px; font-size: 16px; }
    .row .seq { display: inline; margin-left: 6px; }
    .row .pill { justify-self: end; }
    .row .body { grid-column: 1 / -1; }
    .row .summary { font-size: 18px; }
    .row .why { font-size: 19px; }
    .banner { top: 12px; right: 12px; }
  }
  /* New grant */
  .grants-head { display: flex; align-items: baseline; gap: 12px; }
  .grants-head h2 { flex: 1; }
  button.ng-open, .ng button {
    font: inherit; font-size: 17px; font-weight: 600; cursor: pointer;
    padding: 7px 16px; border-radius: 10px;
    background: var(--panel); color: var(--accent);
    border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent);
  }
  button.ng-open:hover { background: var(--accent); color: var(--panel); }
  button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 40%, transparent); outline-offset: 2px; }
  .ng { margin-bottom: 14px; border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .ng h3 { margin-bottom: 4px; }
  .ng .row2 { margin-top: 14px; }
  .ng .lbl { display: block; font-size: 14px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
  .ng input[type=text], .ng input[type=number], .ng select {
    font: inherit; font-size: 18px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px;
  }
  .ng input[type=text] { width: 100%; }
  .ng input[type=number] { width: 84px; font-family: var(--mono); }
  .ng select { min-width: 200px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel-2); flex-wrap: wrap; }
  .seg button { border: 0; border-radius: 0; background: transparent; color: var(--ink-2); padding: 7px 14px; font-size: 17px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .checks label { cursor: pointer; user-select: none; }
  .checks input { position: absolute; opacity: 0; pointer-events: none; }
  .checks .chip { color: var(--ink-2); font-weight: 500; }
  .checks input:not(:checked) + .chip { background: var(--panel-2); border-color: var(--line); }
  .checks input:checked + .chip { background: var(--ok-bg); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); font-weight: 600; }
  .checks input:checked + .chip.t3 { background: var(--tid-bg); color: var(--tid); border-color: color-mix(in srgb, var(--tid) 45%, transparent); }
  .checks input:focus-visible + .chip { outline: 3px solid color-mix(in srgb, var(--accent) 40%, transparent); outline-offset: 2px; }
  .ng .days { display: inline-flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 18px; margin-top: 10px; }
  .ng .muted { color: var(--ink-3); font-size: 17px; }
  .ng .acts { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
  .ng .acts .grow { flex: 1; }
  .ng button.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); }
  .ng button.ghost { color: var(--ink-2); border-color: var(--line); }
  .ng button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1 class="wordmark">Lea<i>sh</i></h1>
    <span class="tagline">Scoped, expiring, logged consent for your agent</span>
  </div>
  <div class="spacer"></div>
  <span class="live" id="live"><span class="dot"></span><span id="live-text">Connecting</span></span>
  <span class="chain" id="chain" role="status">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>
    <span id="chain-text">Checking chain</span>
  </span>
</header>

<main>
  <section aria-labelledby="grants-h">
    <div class="grants-head">
      <h2 id="grants-h">Grants <span class="count" id="grants-count"></span></h2>
      <button type="button" class="ng-open" id="ng-open">+ New grant</button>
    </div>
    <div class="card ng" id="new-grant" hidden></div>
    <div class="grants" id="grants"></div>
  </section>
  <section aria-labelledby="ledger-h">
    <h2 id="ledger-h">Ledger <span class="count" id="ledger-count"></span></h2>
    <div class="legend" aria-hidden="true">
      <span><i style="background:var(--ok)"></i>Allowed</span>
      <span><i style="background:var(--bad)"></i>Denied</span>
      <span><i style="background:var(--ask)"></i>Approved in dialog</span>
      <span><i style="background:var(--tid)"></i>Touch ID</span>
      <span><i style="background:var(--off)"></i>Failed</span>
      <span><i style="background:var(--warn)"></i>Waiting for you</span>
    </div>
    <div class="ledger"><div id="pending"></div><div id="ledger"></div></div>
  </section>
</main>

<div class="banner" id="banner" role="alert" aria-live="assertive" title="Click to dismiss" hidden>
  <svg class="shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6l8-3z"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
  <div class="b-head"><span class="big">Blocked</span><span class="b-tool" id="b-tool"></span></div>
  <span class="b-where" id="b-where"></span>
  <div class="what"><div class="b-summary" id="b-summary"></div><div class="b-why" id="b-why"></div></div>
  <div class="b-bar"></div>
</div>

<script>
(() => {
  'use strict';
  // All server data is rendered with textContent. Ledger text can contain attacker-controlled email text.
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = String(v);
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, String(v));
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const $ = (id) => document.getElementById(id);
  const str = (v) => (v == null ? '' : String(v));

  const APP = {
    calendar: ['Calendar', 'C'],
    reminders: ['Reminders', 'R'],
    mail: ['Mail', 'M'],
    messages: ['Messages', 'T'],
  };
  const TIER = { read: 0, create: 1, draft: 1, modify: 2, send: 3, delete: 3 };

  function decisionClass(d) {
    const s = str(d).toLowerCase();
    if (s.startsWith('touchid')) return s.includes('denied') ? 'd-bad' : 'd-tid';
    if (s.startsWith('approved')) return 'd-ask';
    if (s === 'allowed' || s === 'allow') return 'd-ok';
    if (s.includes('denied') || s === 'deny') return 'd-bad';
    return 'd-off';
  }
  function decisionLabel(d) {
    const s = str(d);
    if (s === 'touchid approved') return 'Touch ID approved';
    if (s === 'touchid denied') return 'Touch ID denied';
    return s ? s[0].toUpperCase() + s.slice(1) : 'Unknown';
  }

  // ---------- Grants ----------
  let grants = [];
  let fetchedAt = 0;

  function fmtLeft(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60;
    const p = (n) => String(n).padStart(2, '0');
    return hh > 0 ? `${hh}:${p(mm)}:${p(ss)}` : `${p(mm)}:${p(ss)}`;
  }
  function fmtClock(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  function scopeRows(g) {
    const r = g.records || {};
    const rows = [];
    if (r.calendars && r.calendars.length) rows.push(['Calendars', r.calendars.join(', ')]);
    if (r.windowDays != null) rows.push(['Window', `Next ${r.windowDays} day${r.windowDays === 1 ? '' : 's'}`]);
    if (r.lists && r.lists.length) rows.push(['Lists', r.lists.join(', ')]);
    if (r.mailboxes && r.mailboxes.length) rows.push(['Mailbox', r.mailboxes.map((m) => `${str(m.account)} / ${str(m.mailbox)}`).join(', ')]);
    if (r.sinceDays != null) rows.push(['Window', `Last ${r.sinceDays} day${r.sinceDays === 1 ? '' : 's'}`]);
    if (r.recipients && r.recipients.length) rows.push(['Send to', r.recipients.join(', ')]);
    if (!rows.length) rows.push(['Records', 'None']);
    const f = g.fields || [];
    const fields = f.includes('*') ? 'All fields' : (f.length ? f.join(', ') : 'None');
    rows.push(['Fields', h('span', { class: f.includes('*') ? '' : 'f', text: fields })]);
    return rows;
  }

  function stateOf(g, now) {
    if (g.revokedAt) return 'revoked';
    if (g.expiresAt == null) return 'session';
    const left = g.msLeft - (now - fetchedAt);
    return left > 0 ? 'active' : 'expired';
  }

  function renderClock(g, now) {
    const st = stateOf(g, now);
    if (st === 'revoked') return h('div', { class: 'clock' }, h('span', { class: 'state revoked', text: 'Revoked' }), h('div', { class: 'sub', text: fmtClock(g.revokedAt) }));
    if (st === 'expired') return h('div', { class: 'clock' }, h('span', { class: 'state expired', text: 'Expired' }), h('div', { class: 'sub', text: fmtClock(g.expiresAt) }));
    if (st === 'session') return h('div', { class: 'clock session' }, h('div', { class: 't', text: 'This session' }), h('div', { class: 'sub', text: 'until Leash stops' }));
    const left = g.msLeft - (now - fetchedAt);
    return h('div', { class: 'clock' + (left < 10 * 60 * 1000 ? ' amber' : '') },
      h('div', { class: 't', text: fmtLeft(left) }),
      h('div', { class: 'sub', text: `left, ends ${fmtClock(g.expiresAt)}` }));
  }

  async function revoke(id, btn) {
    btn.disabled = true;
    btn.textContent = 'Revoking';
    try {
      const res = await fetch(`/api/grants/${encodeURIComponent(id)}/revoke`, { method: 'POST' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Revoke';
    }
    loadGrants();
  }

  function sortGrants(list) {
    const rank = (g) => (g.active ? 0 : g.revokedAt ? 2 : 1);
    return list.slice().sort((a, b) => rank(a) - rank(b));
  }

  function renderGrants() {
    const now = Date.now();
    const root = $('grants');
    root.replaceChildren();
    const shown = sortGrants(grants);
    const active = shown.filter((g) => stateOf(g, now) === 'active' || stateOf(g, now) === 'session').length;
    $('grants-count').textContent = `${active} active`;
    if (!shown.length) {
      root.append(h('div', { class: 'card empty' }, h('strong', { text: 'No grants' }), 'Every call will ask first.'));
      return;
    }
    for (const g of shown) {
      const st = stateOf(g, now);
      const live = st === 'active' || st === 'session';
      const [appName, letter] = APP[g.app] || [str(g.app), '?'];
      const verbs = (g.verbs || []).map((v) => {
        const t = TIER[v] ?? 0;
        return h('span', { class: `chip t${t}` }, str(v), t === 3 ? h('small', { text: 'Touch ID' }) : null);
      });
      const dl = h('dl', { class: 'scope' });
      for (const [k, v] of scopeRows(g)) dl.append(h('dt', { text: k }), h('dd', null, v));
      const card = h('article', { class: 'card' + (live ? '' : ' inactive'), 'data-id': g.id },
        h('div', { class: 'card-top' },
          h('div', { class: 'card-title' },
            h('h3', { text: g.name || g.id }),
            h('div', { class: 'app' }, h('span', { class: `glyph ${str(g.app)}`, text: letter }), appName)),
          h('div', { class: 'clock-slot' }, renderClock(g, now))),
        h('div', { class: 'chips' }, verbs,
          h('span', { class: 'grow' }),
          live ? h('button', { class: 'revoke', type: 'button', title: `Revoke ${str(g.id)}`, onclick: (e) => revoke(g.id, e.currentTarget), text: 'Revoke' }) : null),
        dl);
      root.append(card);
    }
  }

  function tick() {
    const now = Date.now();
    let needsFull = false;
    for (const card of document.querySelectorAll('.card[data-id]')) {
      const g = grants.find((x) => x.id === card.getAttribute('data-id'));
      if (!g) continue;
      const wasLive = !card.classList.contains('inactive');
      const st = stateOf(g, now);
      if (wasLive !== (st === 'active' || st === 'session')) { needsFull = true; break; }
      card.querySelector('.clock-slot').replaceChildren(renderClock(g, now));
    }
    if (needsFull) renderGrants();
  }

  async function loadGrants() {
    try {
      const res = await fetch('/api/grants', { cache: 'no-store' });
      const data = await res.json();
      grants = data.grants || [];
      fetchedAt = Date.now();
      renderGrants();
    } catch (e) { /* keep the last view */ }
  }

  // ---------- Ledger ----------
  const seen = new Set();
  let firstLedger = true;

  function fmtTime(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return str(iso);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  }

  function renderLedger(entries, verify) {
    const root = $('ledger');
    const n = verify ? verify.entries : entries.length;
    $('ledger-count').textContent = `${n} ${n === 1 ? 'entry' : 'entries'}`;
    const chain = $('chain');
    if (verify && verify.intact === false) {
      chain.classList.add('broken');
      $('chain-text').textContent = `Chain broken at #${verify.brokenAt}`;
    } else {
      chain.classList.remove('broken');
      $('chain-text').textContent = `Chain intact, ${n} ${n === 1 ? 'entry' : 'entries'}`;
    }
    if (!entries.length) {
      root.replaceChildren(h('div', { class: 'empty' }, h('strong', { text: 'No calls yet' }), 'Every agent call will land here, newest on top.'));
      seen.clear();
      firstLedger = false;
      return;
    }
    const frag = document.createDocumentFragment();
    const blocked = [];
    for (const e of entries) {
      const key = `${e.seq}:${e.hash}`;
      const isNew = !firstLedger && !seen.has(key);
      const cls = decisionClass(e.decision);
      frag.append(h('div', { class: `row ${cls}${isNew ? ' enter' : ''}` },
        h('div', { class: 'time' }, fmtTime(e.time), h('span', { class: 'seq', text: `#${str(e.seq)}` })),
        h('div', null, h('span', { class: 'pill', text: decisionLabel(e.decision) })),
        h('div', { class: 'body' },
          h('div', { class: 'tool', text: str(e.tool) + (e.agent && e.agent !== 'claude' ? ` · ${e.agent}` : '') }),
          h('div', { class: 'summary', text: str(e.summary) }),
          str(e.why).trim() ? h('div', { class: 'why', text: str(e.why).trim() }) : null,
          e.returned ? h('div', { class: 'returned', text: str(e.returned) }) : null,
          renderWithheld(e.withheld))));
      if (isNew && isBlocked(e)) blocked.push(e);
    }
    if (blocked.length) showBanner(blocked[0]);
    seen.clear();
    for (const e of entries) seen.add(`${e.seq}:${e.hash}`);
    firstLedger = false;
    root.replaceChildren(frag);
  }

  function renderWithheld(w) {
    if (!w) return null;
    const fields = (Array.isArray(w) ? w : (w.fields || [])).map(str).filter(Boolean);
    const records = Array.isArray(w) ? 0 : Number(w.records) || 0;
    if (!fields.length && records <= 0) return null;
    const box = h('div', { class: 'withheld' }, h('span', { class: 'lbl', text: 'Withheld:' }));
    for (const f of fields) {
      box.append(h('span', { class: 'redact', tabindex: '0', title: f, 'aria-label': `Withheld field: ${f}`, text: f }));
    }
    if (records > 0) box.append(h('span', { class: 'hid', text: `${records} ${records === 1 ? 'record' : 'records'} hidden` }));
    return box;
  }

  function isBlocked(e) {
    const d = str(e.decision).toLowerCase();
    return d === 'denied' || d === 'touchid denied';
  }

  // ---------- Attack banner ----------
  let bannerTimer = null;
  function hideBanner() {
    const b = $('banner');
    b.classList.remove('show');
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => { b.hidden = true; }, 500);
  }
  function showBanner(e) {
    const b = $('banner');
    const by = str(e.decidedBy).toLowerCase();
    let where = '';
    if (by === 'phone') where = 'Decided on iPhone';
    else if (by === 'timeout') where = 'No answer, denied';
    else if (by) where = 'Decided on Mac';
    else if (str(e.decision).toLowerCase().startsWith('touchid')) where = 'Decided on Mac';
    else where = 'Blocked by Leash';
    $('b-summary').textContent = str(e.summary);
    $('b-why').textContent = str(e.why).trim();
    $('b-why').hidden = !str(e.why).trim();
    $('b-tool').textContent = str(e.tool);
    $('b-where').textContent = where;
    clearTimeout(bannerTimer);
    b.hidden = false;
    b.classList.remove('show');
    const bar = b.querySelector('.b-bar');
    bar.style.animation = 'none';
    void b.offsetWidth;
    bar.style.animation = '';
    requestAnimationFrame(() => b.classList.add('show'));
    bannerTimer = setTimeout(hideBanner, 6000);
  }
  $('banner').addEventListener('click', hideBanner);
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') hideBanner(); });

  // ---------- Waiting for you (pending phone approvals) ----------
  let pending = [];
  let pendingAt = 0;
  let pendingSkew = 0;
  function renderPending() {
    const root = $('pending');
    const now = Date.now() + pendingSkew;
    const live = pending.filter((a) => !a.expiresAt || Date.parse(a.expiresAt) > now);
    if (!live.length) { root.replaceChildren(); return; }
    root.replaceChildren(...live.map((a) => {
      const left = a.expiresAt ? Date.parse(a.expiresAt) - now : null;
      const [appName] = APP[a.app] || [str(a.app)];
      return h('div', { class: 'row d-warn pending', 'data-id': a.id },
        h('div', { class: 'time' }, left == null ? '' : h('span', { class: 'left', text: fmtLeft(left) }), h('span', { class: 'seq', text: 'left' })),
        h('div', null, h('span', { class: 'pill', text: 'Waiting for you' })),
        h('div', { class: 'body' },
          h('div', { class: 'tool', text: [str(a.tool) || appName, str(a.verb)].filter(Boolean).join(' · ') }),
          h('div', { class: 'summary', text: str(a.summary) }),
          str(a.why).trim() ? h('div', { class: 'why', text: str(a.why).trim() }) : null,
          h('div', { class: 'where', text: 'Approve or deny on your iPhone. No answer means deny.' })));
    }));
  }
  async function loadApprovals() {
    try {
      const res = await fetch('/api/approvals', { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      pending = data.approvals || [];
      if (data.now) pendingSkew = Date.parse(data.now) - Date.now();
      renderPending();
    } catch (e) { pending = []; renderPending(); }
  }

  async function loadLedger() {
    try {
      const res = await fetch('/api/ledger?limit=200', { cache: 'no-store' });
      const data = await res.json();
      renderLedger(data.entries || [], data.verify);
    } catch (e) { /* keep the last view */ }
  }

  // ---------- Live updates: SSE, with 1 s polling while SSE is down ----------
  let pollTimer = null;
  function setLive(on) {
    $('live').classList.toggle('on', on);
    $('live-text').textContent = on ? 'Live' : 'Polling';
    if (on && pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    if (!on && !pollTimer) pollTimer = setInterval(() => { loadGrants(); loadLedger(); loadApprovals(); }, 1000);
  }
  function connect() {
    if (!('EventSource' in window)) { setLive(false); return; }
    const es = new EventSource('/api/events');
    es.addEventListener('open', () => setLive(true));
    es.addEventListener('hello', () => { setLive(true); loadGrants(); loadLedger(); loadApprovals(); });
    es.addEventListener('change', (ev) => {
      let kinds = ['grants', 'ledger'];
      try { kinds = JSON.parse(ev.data).kinds || kinds; } catch {}
      if (kinds.includes('grants')) loadGrants();
      if (kinds.includes('ledger')) loadLedger();
      if (kinds.includes('approvals') || kinds.includes('ledger')) loadApprovals();
    });
    es.addEventListener('error', () => setLive(false));
  }

  loadGrants();
  loadLedger();
  loadApprovals();
  connect();
  setInterval(() => { tick(); if (pending.length) renderPending(); }, 1000);
  setInterval(loadApprovals, 3000);
})();
</script>
<script>
(() => {
  'use strict';
  // New grant card. All Apple names are rendered with textContent.
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = String(v);
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, String(v));
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const SPEC = {
    mail: { label: 'Mail', verbs: ['read', 'draft', 'send'], fields: ['from', 'to', 'subject', 'date', 'body'], dflt: ['from', 'subject', 'date', 'body'] },
    calendar: { label: 'Calendar', verbs: ['read'], fields: ['title', 'start', 'end', 'location', 'notes'], dflt: ['title', 'start', 'end'] },
    reminders: { label: 'Reminders', verbs: ['read', 'create'], fields: ['title', 'notes', 'completed', 'due'], dflt: ['title', 'notes', 'completed', 'due'] },
  };
  const TIER = { read: 't0', draft: 't1', create: 't1', send: 't3' };
  const EXPIRY = [['15 min', 15], ['1 hour', 60], ['4 hours', 240], ['This session', null]];
  const root = document.getElementById('new-grant');
  const openBtn = document.getElementById('ng-open');
  let sources = null; // null = not loaded, { error } or data
  let st = null;

  function fresh() {
    return { name: '', app: 'mail', account: null, mailboxes: new Set(), sinceDays: 30, calendars: new Set(), windowDays: 7, lists: new Set(),
      verbs: new Set(['read']), fields: new Set(SPEC.mail.dflt), expires: 60, error: '', busy: false };
  }
  function seg(options, current, pick) {
    return h('div', { class: 'seg', role: 'group' }, options.map(([label, val]) =>
      h('button', { type: 'button', 'aria-pressed': String(val === current), onclick: () => pick(val), text: label })));
  }
  function checks(items, set, label, tier) {
    return h('div', { class: 'checks' }, items.map((it) => {
      const input = h('input', { type: 'checkbox' });
      input.checked = set.has(it);
      input.addEventListener('change', () => { input.checked ? set.add(it) : set.delete(it); });
      return h('label', null, input, h('span', { class: 'chip' + (tier ? ' ' + (tier(it) || '') : ''), text: label ? label(it) : it }));
    }));
  }
  function block(title, ...kids) { return h('div', { class: 'row2' }, h('span', { class: 'lbl', text: title }), ...kids); }
  function daysInput(prefix, value, max, set) {
    const inp = h('input', { type: 'number', min: 1, max, value });
    inp.addEventListener('input', () => set(Number(inp.value)));
    return h('label', { class: 'days' }, prefix, inp, 'days');
  }

  function scopeBlock() {
    if (!sources) return block('Scope', h('div', { class: 'muted', text: 'Reading your accounts...' }));
    if (sources.error) return block('Scope', h('div', { class: 'error', text: sources.error }),
      h('div', { class: 'acts' }, h('button', { type: 'button', class: 'ghost', onclick: loadSources, text: 'Retry' })));
    const appErr = (sources.errors || []).filter((e) => e && String(e.app).toLowerCase() === st.app).map((e) => h('div', { class: 'error', text: `${e.app}: ${e.message}` }));
    if (st.app === 'mail') {
      const accts = sources.mail || [];
      if (!accts.length) return block('Mailboxes', appErr, h('div', { class: 'muted', text: 'No Mail accounts found.' }));
      if (!accts.some((a) => a.account === st.account)) st.account = accts[0].account;
      const sel = h('select', { 'aria-label': 'Account' }, accts.map((a) => { const o = h('option', { text: a.account }); o.value = a.account; return o; }));
      sel.value = st.account;
      sel.addEventListener('change', () => { st.account = sel.value; st.mailboxes = new Set(); render(); });
      const acct = accts.find((a) => a.account === st.account);
      return h('div', null, block('Account', appErr, sel),
        block('Mailboxes', (acct.mailboxes || []).length ? checks(acct.mailboxes, st.mailboxes) : h('div', { class: 'muted', text: 'No mailboxes in this account.' }),
          daysInput('Last', st.sinceDays, 365, (n) => { st.sinceDays = n; })));
    }
    if (st.app === 'calendar') {
      const cals = sources.calendars || [];
      return block('Calendars', appErr, cals.length ? checks(cals, st.calendars) : h('div', { class: 'muted', text: 'No calendars found.' }),
        daysInput('Next', st.windowDays, 31, (n) => { st.windowDays = n; }));
    }
    const lists = sources.lists || [];
    return block('Lists', appErr, lists.length ? checks(lists, st.lists) : h('div', { class: 'muted', text: 'No lists found.' }));
  }

  function render() {
    root.replaceChildren();
    if (!st) { root.hidden = true; openBtn.hidden = false; return; }
    root.hidden = false; openBtn.hidden = true;
    const spec = SPEC[st.app];
    const name = h('input', { type: 'text', maxlength: 60, placeholder: 'e.g. Triage the demo inbox', 'aria-label': 'Grant name' });
    name.value = st.name;
    name.addEventListener('input', () => { st.name = name.value; });
    root.append(
      h('h3', { text: 'New grant' }),
      block('Name', name),
      block('App', seg(Object.entries(SPEC).map(([k, v]) => [v.label, k]), st.app, (app) => {
        if (app === st.app) return;
        st.app = app; st.verbs = new Set(['read']); st.fields = new Set(SPEC[app].dflt); st.error = ''; render();
      })),
      scopeBlock(),
      block('Verbs', checks(spec.verbs, st.verbs, (v) => (v === 'send' ? 'send (Touch ID every time)' : v), (v) => TIER[v])),
      block('Fields', checks(spec.fields, st.fields)),
      block('Expires', seg(EXPIRY, st.expires, (v) => { st.expires = v; render(); })),
      ...(st.error ? [h('div', { class: 'error', role: 'alert', text: st.error })] : []),
      h('div', { class: 'acts' },
        h('button', { type: 'button', class: 'primary', disabled: st.busy || null, onclick: create, text: st.busy ? 'Creating' : 'Create grant' }),
        h('button', { type: 'button', class: 'ghost', onclick: close, text: 'Cancel' }),
        h('span', { class: 'grow' })),
    );
  }

  async function loadSources() {
    sources = null; render();
    try {
      const res = await fetch('/api/sources', { cache: 'no-store' });
      const data = await res.json().catch(() => ({ error: 'The viewer sent something unreadable.' }));
      sources = res.ok ? data : { error: data.error || `Could not read your accounts (${res.status}).` };
    } catch (e) {
      sources = { error: 'Could not reach the viewer.' };
    }
    if (st) render();
  }

  function body() {
    const records = st.app === 'mail'
      ? { mailboxes: [...st.mailboxes].map((m) => ({ account: st.account, mailbox: m })), sinceDays: st.sinceDays }
      : st.app === 'calendar' ? { calendars: [...st.calendars], windowDays: st.windowDays } : { lists: [...st.lists] };
    const all = SPEC[st.app].fields;
    const fields = st.app === 'reminders' && all.every((f) => st.fields.has(f)) ? ['*'] : all.filter((f) => st.fields.has(f));
    return { name: st.name.trim(), app: st.app, verbs: SPEC[st.app].verbs.filter((v) => st.verbs.has(v)), records, fields, expiresInMin: st.expires };
  }

  async function create() {
    st.busy = true; st.error = ''; render();
    try {
      const res = await fetch('/api/grants', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body()) });
      if (res.ok) { close(); return; }
      st.error = (await res.text()) || `Could not create the grant (${res.status}).`;
    } catch (e) {
      st.error = 'Could not reach the viewer.';
    }
    st.busy = false; render();
  }

  function open() {
    st = fresh(); render();
    root.querySelector('input[type=text]')?.focus();
    if (!sources || sources.error) loadSources();
  }
  function close() { st = null; render(); openBtn.focus(); }
  openBtn.addEventListener('click', open);
  root.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
})();
</script>
</body>
</html>
